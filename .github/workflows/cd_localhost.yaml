name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest code
        run: git pull origin main

      - name: Install dependencies
        shell: powershell
        run: |
          & "C:\Users\kivan\AppData\Local\Programs\Python\Python310\python.exe" -m pip install --upgrade pip
          & "C:\Users\kivan\AppData\Local\Programs\Python\Python310\python.exe" -m pip install django

      - name: Stop previous Django instance
        shell: powershell
        run: |
          cmd /c "schtasks /End /TN DjangoDevServer >nul 2>&1"
          $procs = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "runserver" }
          foreach ($p in $procs) {
            Write-Host "Stopping PID $($p.ProcessId)"
            Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Previous instances stopped."
          exit 0

      - name: Launch new Django instance
        shell: powershell
        run: |
          $py = "C:\Users\kivan\AppData\Local\Programs\Python\Python310\python.exe"
          $workDir = "$PWD"
          $taskName = "DjangoDevServer"
          $logPath = "$env:USERPROFILE\django_server.log"
          $batPath = "$env:USERPROFILE\run_django.bat"
          # Django'yu baslatan bat dosyasini olustur (tum bosluklu yollar burada guvenle kalir)
          $batContent = @"
          @echo off
          cd /d "$workDir"
          "$py" manage.py runserver localhost:8000 --noreload > "$logPath" 2>&1
          "@
          Set-Content -Path $batPath -Value $batContent -Encoding ASCII
          Write-Host "Created bat file at $batPath"
          # Eski task'i temizle, yeni task olustur (TR sadece bat yolu - bosluk yok)
          cmd /c "schtasks /Delete /TN $taskName /F >nul 2>&1"
          schtasks /Create /TN $taskName /TR "$batPath" /SC ONCE /ST 23:59 /F
          schtasks /Run /TN $taskName
          Start-Sleep -Seconds 8
          Write-Host "Checking if Django responds on /polls/ ..."
          try {
            $resp = Invoke-WebRequest -Uri "http://localhost:8000/polls/" -UseBasicParsing -TimeoutSec 10
            Write-Host "Django is UP. Status: $($resp.StatusCode)"
          } catch {
            if ($_.Exception.Response) {
              Write-Host "Django is UP (HTTP $([int]$_.Exception.Response.StatusCode))"
            } else {
              Write-Host "Django NOT reachable. Log:"
              Get-Content $logPath -ErrorAction SilentlyContinue
            }
          }
