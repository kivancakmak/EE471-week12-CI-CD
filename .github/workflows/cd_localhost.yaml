name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest code
        run: git pull origin main

      - name: Install dependencies
        shell: powershell
        run: |
          & "C:\Users\kivan\AppData\Local\Programs\Python\Python310\python.exe" -m pip install --upgrade pip
          & "C:\Users\kivan\AppData\Local\Programs\Python\Python310\python.exe" -m pip install django

      - name: Stop previous Django instance
        shell: powershell
        run: |
          $procs = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "runserver" }
          foreach ($p in $procs) {
            Write-Host "Stopping PID $($p.ProcessId)"
            Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Previous instances stopped."

      - name: Launch new Django instance
        shell: powershell
        run: |
          $py = "C:\Users\kivan\AppData\Local\Programs\Python\Python310\python.exe"
          $logPath = "$env:USERPROFILE\django_server.log"
          $errPath = "$env:USERPROFILE\django_server_err.log"
          Start-Process -FilePath $py `
            -ArgumentList "manage.py","runserver","localhost:8000","--noreload" `
            -WorkingDirectory "$PWD" `
            -RedirectStandardOutput $logPath `
            -RedirectStandardError $errPath `
            -WindowStyle Hidden
          Start-Sleep -Seconds 5
          Write-Host "Checking if Django responds..."
          try {
            $resp = Invoke-WebRequest -Uri "http://localhost:8000/" -UseBasicParsing -TimeoutSec 10
            Write-Host "Django is UP. Status: $($resp.StatusCode)"
          } catch {
            Write-Host "Could not reach Django. Logs below:"
            Get-Content $logPath -ErrorAction SilentlyContinue
            Get-Content $errPath -ErrorAction SilentlyContinue
          }
