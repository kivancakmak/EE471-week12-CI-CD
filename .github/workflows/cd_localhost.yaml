name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest code
        run: git pull origin main

      - name: Install dependencies
        shell: powershell
        run: |
          & "C:\Users\kivan\AppData\Local\Programs\Python\Python310\python.exe" -m pip install --upgrade pip
          & "C:\Users\kivan\AppData\Local\Programs\Python\Python310\python.exe" -m pip install django

      - name: Stop previous Django instance
        shell: powershell
        run: |
          schtasks /End /TN "DjangoDevServer" 2>$null
          $procs = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "runserver" }
          foreach ($p in $procs) {
            Write-Host "Stopping PID $($p.ProcessId)"
            Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Previous instances stopped."

      - name: Launch new Django instance
        shell: powershell
        run: |
          $py = "C:\Users\kivan\AppData\Local\Programs\Python\Python310\python.exe"
          $workDir = "$PWD"
          $taskName = "DjangoDevServer"
          # Eski görevi temizle
          schtasks /Delete /TN $taskName /F 2>$null
          # Django'yu başlatan bir batch komutu hazırla
          $action = "cmd /c cd /d `"$workDir`" && `"$py`" manage.py runserver localhost:8000 --noreload > `"$env:USERPROFILE\django_server.log`" 2>&1"
          # Scheduled task oluştur ve hemen çalıştır (runner ağacından bağımsız)
          schtasks /Create /TN $taskName /TR $action /SC ONCE /ST 00:00 /F /RL HIGHEST
          schtasks /Run /TN $taskName
          Start-Sleep -Seconds 8
          Write-Host "Checking if Django responds on /polls/ ..."
          try {
            $resp = Invoke-WebRequest -Uri "http://localhost:8000/polls/" -UseBasicParsing -TimeoutSec 10
            Write-Host "Django is UP. Status: $($resp.StatusCode)"
          } catch {
            if ($_.Exception.Response) {
              Write-Host "Django is UP (HTTP $([int]$_.Exception.Response.StatusCode))"
            } else {
              Write-Host "Django NOT reachable. Log:"
              Get-Content "$env:USERPROFILE\django_server.log" -ErrorAction SilentlyContinue
            }
          }
