name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest code
        run: git pull origin main

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django

      - name: Stop previous Django instance
        shell: powershell
        run: |
          $procs = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "runserver" }
          foreach ($p in $procs) {
            Write-Host "Stopping PID $($p.ProcessId)"
            Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Previous instances stopped."

      - name: Launch new Django instance
        shell: powershell
        run: |
          cd mysite
          Start-Process python -ArgumentList "manage.py","runserver","localhost:8000" -WindowStyle Hidden
          Write-Host "Django launched on localhost:8000"
